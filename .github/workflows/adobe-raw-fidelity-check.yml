name: Adobe RAW / XMP Rust validation

on:
  push:
    branches:
      - feature/adobe-raw-stage-fidelity
  pull_request:
    branches:
      - feature/adobe-fidelity

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust library check
        working-directory: src-tauri
        run: cargo check --lib
      - name: Rust unit tests (including Adobe oracle fixtures)
        working-directory: src-tauri
        run: cargo test --lib
